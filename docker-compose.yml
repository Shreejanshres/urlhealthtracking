services:
  postgres:
    image: postgres:17
    container_name: urltracking-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: urltracking
      POSTGRES_USER: urltracking
      POSTGRES_PASSWORD: urltracking
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: urltracking-redis
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: